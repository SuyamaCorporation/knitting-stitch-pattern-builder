<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ニット 編み目パターン デザイナー</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4">
  <div class="max-w-6xl mx-auto">
    <h1 class="text-2xl font-bold mb-1 text-pink-400">ニット 編み目パターン デザイナー</h1>
    <p class="text-gray-400 text-sm mb-4">棒針編みチャート設計ツール</p>

    <div class="flex gap-4">
      <!-- Left panel: tools + settings -->
      <div class="w-56 shrink-0">
        <!-- Grid size -->
        <div class="bg-gray-800 rounded p-3 mb-3">
          <h2 class="text-xs font-bold text-gray-400 mb-2">グリッドサイズ</h2>
          <div class="space-y-2">
            <div>
              <label for="grid-cols" class="text-xs text-gray-400">列数 (幅)</label>
              <input id="grid-cols" type="number" value="20" min="2" max="40"
                class="w-full bg-gray-700 border border-gray-600 rounded px-2 py-1 text-sm text-gray-100 focus:outline-none focus:border-pink-500 mt-0.5">
            </div>
            <div>
              <label for="grid-rows" class="text-xs text-gray-400">行数 (高さ)</label>
              <input id="grid-rows" type="number" value="20" min="2" max="40"
                class="w-full bg-gray-700 border border-gray-600 rounded px-2 py-1 text-sm text-gray-100 focus:outline-none focus:border-pink-500 mt-0.5">
            </div>
            <button id="apply-size-btn"
              class="w-full bg-gray-700 hover:bg-gray-600 text-sm text-gray-200 py-1.5 rounded transition-colors"
              aria-label="グリッドサイズを適用する">
              適用
            </button>
          </div>
        </div>

        <!-- Tool palette -->
        <div class="bg-gray-800 rounded p-3 mb-3">
          <h2 class="text-xs font-bold text-gray-400 mb-2">ツール</h2>
          <div class="grid grid-cols-2 gap-1.5" id="tool-palette"></div>
        </div>

        <!-- Actions -->
        <div class="bg-gray-800 rounded p-3 space-y-2">
          <h2 class="text-xs font-bold text-gray-400 mb-2">操作</h2>
          <button id="clear-btn"
            class="w-full bg-gray-700 hover:bg-gray-600 text-sm text-gray-200 py-1.5 rounded transition-colors"
            aria-label="グリッドをクリアする">
            クリア
          </button>
          <button id="fill-btn"
            class="w-full bg-gray-700 hover:bg-gray-600 text-sm text-gray-200 py-1.5 rounded transition-colors"
            aria-label="表目で全填めする">
            全面 表目
          </button>
          <button id="save-btn"
            class="w-full bg-gray-700 hover:bg-gray-600 text-sm text-gray-200 py-1.5 rounded transition-colors"
            aria-label="パターンを保存する">
            保存
          </button>
          <button id="load-btn"
            class="w-full bg-gray-700 hover:bg-gray-600 text-sm text-gray-200 py-1.5 rounded transition-colors"
            aria-label="保存したパターンを読み込む">
            読込
          </button>
          <button id="png-btn"
            class="w-full bg-pink-700 hover:bg-pink-600 text-white text-sm py-1.5 rounded transition-colors"
            aria-label="PNG画像として出力する">
            PNG出力
          </button>
        </div>

        <!-- Legend -->
        <div class="bg-gray-800 rounded p-3 mt-3">
          <h2 class="text-xs font-bold text-gray-400 mb-2">凡例</h2>
          <div id="legend" class="text-xs space-y-1"></div>
        </div>
      </div>

      <!-- Canvas area -->
      <div class="flex-1">
        <div class="bg-gray-800 rounded p-3 overflow-auto">
          <canvas id="knit-canvas"
            role="img" aria-label="編み目パターングリッドキャンバス"
            style="cursor: crosshair; image-rendering: pixelated;"></canvas>
        </div>
        <p class="text-xs text-gray-500 mt-2">クリックまたはドラッグで描画</p>
      </div>
    </div>
  </div>

  <script>
    const LS_KEY = 'knitting-pattern';

    const STITCHES = [
      { id: 'knit',   label: '表目',   symbol: '□', bg: '#1f2937', fg: '#d1d5db', border: '#4b5563' },
      { id: 'purl',   label: '裏目',   symbol: '●', bg: '#1e3a5f', fg: '#93c5fd', border: '#3b82f6' },
      { id: 'twist',  label: 'ねじり目', symbol: '×', bg: '#3b1f2f', fg: '#f9a8d4', border: '#ec4899' },
      { id: 'yo',     label: '掛け目',  symbol: '○', bg: '#1a3a2f', fg: '#6ee7b7', border: '#34d399' },
      { id: 'k2tog',  label: '右上2目一度', symbol: '/', bg: '#3a2f1a', fg: '#fcd34d', border: '#f59e0b' },
      { id: 'ssk',    label: '左上2目一度', symbol: '\\', bg: '#2f1a3a', fg: '#c4b5fd', border: '#8b5cf6' },
      { id: 'sl',     label: 'すべり目', symbol: '△', bg: '#1a2f3a', fg: '#67e8f9', border: '#06b6d4' },
      { id: 'empty',  label: '空白',    symbol: ' ', bg: '#111827', fg: '#374151', border: '#1f2937' },
    ];

    let cols = 20, rows = 20;
    let grid = [];
    let selectedStitch = STITCHES[0];
    let isDrawing = false;
    let cellSize = 28;

    const canvas = document.getElementById('knit-canvas');
    const ctx = canvas.getContext('2d');

    function initGrid(c, r) {
      const newGrid = [];
      for (let row = 0; row < r; row++) {
        newGrid[row] = [];
        for (let col = 0; col < c; col++) {
          newGrid[row][col] = (grid[row] && grid[row][col]) ? grid[row][col] : 'knit';
        }
      }
      grid = newGrid;
    }

    function resizeCanvas() {
      canvas.width = cols * cellSize + 1;
      canvas.height = rows * cellSize + 1;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      // Background
      ctx.fillStyle = '#111827';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const st = STITCHES.find(s => s.id === grid[r][c]) || STITCHES[0];
          const x = c * cellSize;
          const y = r * cellSize;

          // Cell bg
          ctx.fillStyle = st.bg;
          ctx.fillRect(x + 1, y + 1, cellSize - 1, cellSize - 1);

          // Border
          ctx.strokeStyle = st.border;
          ctx.lineWidth = 0.5;
          ctx.strokeRect(x + 0.5, y + 0.5, cellSize, cellSize);

          // Symbol
          if (st.symbol && st.symbol !== ' ') {
            ctx.fillStyle = st.fg;
            ctx.font = `${Math.floor(cellSize * 0.55)}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(st.symbol, x + cellSize / 2, y + cellSize / 2);
          }
        }
      }

      // Row numbers (right side)
      ctx.fillStyle = '#6b7280';
      ctx.font = '9px sans-serif';
      ctx.textAlign = 'left';
      for (let r = 0; r < rows; r++) {
        ctx.fillText(rows - r, cols * cellSize + 3, r * cellSize + cellSize / 2 + 3);
      }

      // Col numbers (bottom)
      ctx.textAlign = 'center';
      for (let c = 0; c < cols; c++) {
        if ((c + 1) % 5 === 0 || c === 0) {
          ctx.fillText(cols - c, c * cellSize + cellSize / 2, rows * cellSize + 12);
        }
      }
    }

    function getCellFromEvent(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = (e.clientX - rect.left) * scaleX;
      const y = (e.clientY - rect.top) * scaleY;
      const c = Math.floor(x / cellSize);
      const r = Math.floor(y / cellSize);
      return { r, c };
    }

    function paintCell(r, c) {
      if (r >= 0 && r < rows && c >= 0 && c < cols) {
        grid[r][c] = selectedStitch.id;
        draw();
      }
    }

    canvas.addEventListener('mousedown', e => {
      isDrawing = true;
      const { r, c } = getCellFromEvent(e);
      paintCell(r, c);
    });
    canvas.addEventListener('mousemove', e => {
      if (!isDrawing) return;
      const { r, c } = getCellFromEvent(e);
      paintCell(r, c);
    });
    window.addEventListener('mouseup', () => { isDrawing = false; });

    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      isDrawing = true;
      const touch = e.touches[0];
      const { r, c } = getCellFromEvent(touch);
      paintCell(r, c);
    }, { passive: false });
    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      if (!isDrawing) return;
      const touch = e.touches[0];
      const { r, c } = getCellFromEvent(touch);
      paintCell(r, c);
    }, { passive: false });
    canvas.addEventListener('touchend', () => { isDrawing = false; });

    // Build tool palette
    const palette = document.getElementById('tool-palette');
    STITCHES.forEach(st => {
      const btn = document.createElement('button');
      btn.className = 'rounded p-1.5 text-center border transition-all';
      btn.style.background = st.bg;
      btn.style.borderColor = st.border;
      btn.style.color = st.fg;
      btn.setAttribute('aria-label', st.label + 'ツールを選択する');
      btn.id = 'tool-' + st.id;

      const symEl = document.createElement('div');
      symEl.className = 'text-base font-bold';
      symEl.textContent = st.symbol || ' ';

      const labelEl = document.createElement('div');
      labelEl.className = 'text-xs mt-0.5 truncate';
      labelEl.style.color = '#9ca3af';
      labelEl.textContent = st.label;

      btn.appendChild(symEl);
      btn.appendChild(labelEl);
      btn.addEventListener('click', () => {
        selectedStitch = st;
        document.querySelectorAll('#tool-palette button').forEach(b => b.classList.remove('ring-2', 'ring-pink-400'));
        btn.classList.add('ring-2', 'ring-pink-400');
      });
      palette.appendChild(btn);
    });

    // Build legend
    const legend = document.getElementById('legend');
    STITCHES.filter(s => s.id !== 'empty').forEach(st => {
      const row = document.createElement('div');
      row.className = 'flex items-center gap-1';
      const sym = document.createElement('span');
      sym.style.color = st.fg;
      sym.textContent = st.symbol;
      sym.className = 'w-4 text-center';
      const lbl = document.createElement('span');
      lbl.className = 'text-gray-400';
      lbl.textContent = st.label;
      row.appendChild(sym);
      row.appendChild(lbl);
      legend.appendChild(row);
    });

    function selectTool(id) {
      const st = STITCHES.find(s => s.id === id);
      if (st) {
        selectedStitch = st;
        document.querySelectorAll('#tool-palette button').forEach(b => b.classList.remove('ring-2', 'ring-pink-400'));
        document.getElementById('tool-' + id)?.classList.add('ring-2', 'ring-pink-400');
      }
    }
    selectTool('knit');

    document.getElementById('apply-size-btn').addEventListener('click', () => {
      const newCols = Math.min(40, Math.max(2, parseInt(document.getElementById('grid-cols').value) || 20));
      const newRows = Math.min(40, Math.max(2, parseInt(document.getElementById('grid-rows').value) || 20));
      cols = newCols; rows = newRows;
      initGrid(cols, rows);
      resizeCanvas();
      draw();
    });

    document.getElementById('clear-btn').addEventListener('click', () => {
      if (confirm('グリッドをクリアしますか？')) {
        grid = [];
        initGrid(cols, rows);
        draw();
      }
    });

    document.getElementById('fill-btn').addEventListener('click', () => {
      for (let r = 0; r < rows; r++)
        for (let c = 0; c < cols; c++)
          grid[r][c] = 'knit';
      draw();
    });

    document.getElementById('save-btn').addEventListener('click', () => {
      localStorage.setItem(LS_KEY, JSON.stringify({ cols, rows, grid }));
      alert('保存しました。');
    });

    document.getElementById('load-btn').addEventListener('click', () => {
      const saved = localStorage.getItem(LS_KEY);
      if (!saved) { alert('保存データがありません。'); return; }
      try {
        const d = JSON.parse(saved);
        cols = d.cols; rows = d.rows; grid = d.grid;
        document.getElementById('grid-cols').value = cols;
        document.getElementById('grid-rows').value = rows;
        resizeCanvas();
        draw();
        alert('読み込みました。');
      } catch(e) { alert('読み込み失敗。'); }
    });

    document.getElementById('png-btn').addEventListener('click', () => {
      // Draw with white background for PNG
      const tmpCanvas = document.createElement('canvas');
      tmpCanvas.width = canvas.width + 20;
      tmpCanvas.height = canvas.height + 20;
      const tCtx = tmpCanvas.getContext('2d');
      tCtx.fillStyle = '#ffffff';
      tCtx.fillRect(0, 0, tmpCanvas.width, tmpCanvas.height);
      tCtx.drawImage(canvas, 10, 10);
      const url = tmpCanvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = url;
      a.download = 'knit-pattern-' + new Date().toISOString().slice(0,10) + '.png';
      a.click();
    });

    initGrid(cols, rows);
    resizeCanvas();
    draw();
  </script>
</body>
</html>
